include:
  - component: gitlab.protontech.ch/proton/devops/cicd-components/kubernetes/atlas-deploy/pipenv@0.7.0
    inputs:
      cleanup-stage: cleanup

  - component: gitlab.protontech.ch/proton/devops/cicd-components/kubernetes/atlas-deploy/pipenv@0.7.0
    inputs:
      cleanup-stage: cleanup
      deploy: manual
      cleanup: manual
      images: $IMAGES
      features: $FEATURES
      key: customenv$CI_PIPELINE_ID
      suffix: ":custom"
  
  - project: "translations/generator"
    ref: master
    file: "/jobs/sync-crowdin.gitlab-ci.yml"

  - project: "translations/generator"
    ref: master
    file: "/jobs/commit-locales.gitlab-ci.yml"

stages:
  - i18n
  - linting
  - unit_test
  - deploy
  - ui_and_integration_test
  - report
  - cleanup
  - github

variables:
  LC_ALL: "en_US.UTF-8"
  LANG: "en_US.UTF-8"
  GEM_HOME: "$CI_PROJECT_DIR/gem"
  ATLAS_DEPLOY_LIST: ""
  GIT_DEPTH: 20
  GIT_STRATEGY: clone
  FF_ENABLE_JOB_CLEANUP: "true"
  IMAGES: $IMAGES
  FEATURES: $FEATURES

.add_private_ssh_key: &add_private_ssh_key
  - echo "$CI_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null

.clone_pmconstants: &clone_pmconstants
  - rm -rf ../pmconstants
  - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@${PROTON_GIT_URL}/apple/shared/pmconstants ../pmconstants

.setup_permissions: &setup_permissions
  - echo -e "machine gitlab.protontech.ch\n  login gitlab-ci-token\n  password $CI_JOB_TOKEN\n\n" > ~/.netrc
  - chmod 0600 ~/.netrc

.tear_down_simulator: &tear_down_simulator
  - DEVICE_NAME=$CI_PIPELINE_ID-$CI_JOB_NAME
  - xcrun simctl delete $DEVICE_NAME

.rules_mr: &rules_mr
  - if: '$CI_PIPELINE_SOURCE == "web"'
    when: never
  - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
    when: never
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    when: always

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "develop"
      variables:
        ATLAS_DEPLOY_ENV: "true"

    - if: $CI_OPEN_MERGE_REQUESTS
      when: never

    - if: $CI_PIPELINE_SOURCE == "push"
      when: never

    - if: $CI_COMMIT_BRANCH
      variables:
        TEST: "manual"

github:mirror:
  stage: github
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_TITLE =~ /^Merge branch .release\/.+ into .+$/'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
    - if: "$CI_COMMIT_BRANCH"
      when: never
  allow_failure: false
  interruptible: false
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PIPELINE_ID/github-mirror
  needs: []
  script:
    - zsh scripts/mirror_to_github.sh develop
  tags:
    - account-lane-3

#
# --- Linting ---
#

linting:code-quality:
  stage: linting
  script:
    - env
    - tools/portable_swiftlint/swiftlint --config .swiftlint.yml --reporter junit > swiftlint.xml

  rules: &rules_mr_and_develop
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $TEST == "manual"
      when: manual

    # We do not want to run jobs if the schedule doesn't deploy 
    - if: $CI_PIPELINE_SOURCE == "schedule" && $ATLAS_DEPLOY_ENV != "true"
      when: never

    - when: on_success

  needs: []
  allow_failure: false
  interruptible: true
  artifacts:
    name: "ios-lint-$CI_COMMIT_SHA"
    paths:
      - swiftlint.xml
    reports:
      junit:
        - swiftlint.xml
    expire_in: 90 days
  tags:
    - macstadium-m1-protoncore

linting:commits:
  stage: linting
  before_script:
    - *setup_permissions
  script:
    - |
      # Lint commits on branches only (not tags)
      if [ -z "$CI_COMMIT_TAG" ] && [ "$CI_MERGE_REQUEST_EVENT_TYPE" != "merge_train" ]; then
          mint run git-lhc lint --verbose --train core # Lint commit history
      fi

  rules: &rules_mr_and_develop
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $TEST == "manual"
      when: manual

    # We do not want to run jobs if the schedule doesn't deploy 
    - if: $CI_PIPELINE_SOURCE == "schedule" && $ATLAS_DEPLOY_ENV != "true"
      when: never

    - when: on_success

  needs: []
  allow_failure: false
  interruptible: true
  tags:
    - macstadium-m1-protoncore

#
# --- Unit testing ---
#

test:unit:ios:all:
  stage: unit_test
  retry: 2
  rules: *rules_mr_and_develop
  allow_failure: true
  interruptible: true
  before_script:
    - *add_private_ssh_key
    - *clone_pmconstants
  script:
    - fastlane run_unit_tests
  after_script:
    - fastlane cleanup_unit_tests
    - ssh-add -D
  artifacts:
    name: "ios-tests-$CI_COMMIT_SHA"
    when: always
    paths:
      - fastlane/test_output/UnitTests.xcresult/**
    expire_in: 14 days
    reports:
      junit:
        - fastlane/test_output/report.junit
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PIPELINE_ID/account-lane-1
  tags:
    - account-lane-1

test:unit:macos:all:
  stage: unit_test
  retry: 2
  rules: *rules_mr_and_develop
  allow_failure: true
  interruptible: true
  before_script:
    - *add_private_ssh_key
    - *clone_pmconstants
  script:
    - fastlane run_unit_tests_macos
  after_script:
    - fastlane cleanup_unit_tests_macos
  artifacts:
    paths:
      - fastlane/test_output/*xcresult/**
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PIPELINE_ID/account-lane-2
  tags:
    - account-lane-2

test:unit:localization:
  stage: unit_test
  retry: 1
  rules: *rules_mr_and_develop
  allow_failure: false
  interruptible: true
  before_script:
    - *add_private_ssh_key
  script:
    - fastlane run_localization_tests
  after_script:
    - fastlane cleanup_localization_tests
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PIPELINE_ID/account-lane-3
  tags:
    - account-lane-3

#
# --- Integration testing
#

test:unit:integration:
  stage: ui_and_integration_test
  retry: 1
  rules: *rules_mr_and_develop
  allow_failure: true
  interruptible: true
  needs:
    - job: atlas:deploy:pipenv
      artifacts: true
  before_script:
    - *add_private_ssh_key
    - *clone_pmconstants
  script:
    - fastlane run_integration_tests xcargs:DYNAMIC_DOMAIN="${DYNAMIC_DOMAIN}"
  after_script:
    - fastlane cleanup_integration_tests
  artifacts:
    paths:
      - fastlane/test_output/*xcresult/**
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PIPELINE_ID/account-lane-4
  tags:
    - account-lane-4

#
# --- Coverage reports ---
#

report:integration:code:coverage:
  retry: 1
  coverage: '/Average Coverage.* (\d+\.\d+%)/'
  stage: report
  interruptible: true
  rules: *rules_mr_and_develop
  allow_failure: true
  needs:
    - job: test:unit:integration
      artifacts: true
  before_script:
    - *add_private_ssh_key
    - bash scripts/generate_obfuscated_constants.sh
    - ls -l fastlane/test_output
  script:
    # Call xcov from fastlane
    - fastlane integration_test_reports
    # generate alt coverage json from xcresult
    - xcrun xccov view --report --json fastlane/test_output/IntegrationTests.xcresult > fastlane/test_output/IntegrationTests.json
    # Print and process the result for Gitlab coverage capture
    - jq '"Line Coverage \(.lineCoverage * 100 |tostring | .[0:5])%"' fastlane/test_output/IntegrationTests.json
    # generate cobertura xml from coverage json
    - xcc generate fastlane/test_output/IntegrationTests.json fastlane/test_output cobertura-xml --verbose
    # Split big cobertura file
    - python3 scripts/split-by-package.py fastlane/test_output/cobertura.xml fastlane/test_output/
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: fastlane/test_output/cobertura-*.xml
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PIPELINE_ID/account-lane-4
  tags:
    - account-lane-4

report:unit:macos:code:coverage:
  retry: 1
  coverage: '/Average Coverage.* (\d+\.\d+%)/'
  stage: report
  interruptible: true
  rules: *rules_mr_and_develop
  allow_failure: true
  needs:
    - job: test:unit:macos:all
      artifacts: true
  before_script:
    - *add_private_ssh_key
    - bash scripts/generate_obfuscated_constants.sh
    - ls -l fastlane/test_output
  script:
    # Call xcov from fastlane
    - fastlane macos_unit_test_reports
    # generate alt coverage json from xcresult
    - xcrun xccov view --report --json fastlane/test_output/UnitTests.xcresult > fastlane/test_output/UnitTests.json
    # Print and process the result for Gitlab coverage capture
    - jq '"Line Coverage \(.lineCoverage * 100 |tostring | .[0:5])%"' fastlane/test_output/UnitTests.json
    # generate cobertura xml from coverage json
    - xcc generate fastlane/test_output/UnitTests.json fastlane/test_output cobertura-xml --verbose
    # Split big cobertura file
    - python3 scripts/split-by-package.py fastlane/test_output/cobertura.xml fastlane/test_output/
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: fastlane/test_output/cobertura-*.xml
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PIPELINE_ID/account-lane-2
  tags:
    - account-lane-2

report:unit:ios:code:coverage:
  retry: 1
  coverage: '/Average Coverage.* (\d+\.\d+%)/'
  stage: report
  interruptible: true
  rules: *rules_mr_and_develop
  allow_failure: true
  needs:
    - job: test:unit:ios:all
      artifacts: true
  before_script:
    - *add_private_ssh_key
    - bash scripts/generate_obfuscated_constants.sh
    - ls -l fastlane/test_output
  script:
    # Call xcov from fastlane
    - fastlane unit_test_reports
    # generate alt coverage json from xcresult
    - xcrun xccov view --report --json fastlane/test_output/UnitTests.xcresult > fastlane/test_output/UnitTests.json
    # Print and process the result for Gitlab coverage capture
    - jq '"Line Coverage \(.lineCoverage * 100 |tostring | .[0:5])%"' fastlane/test_output/UnitTests.json
    # generate cobertura xml from coverage json
    - xcc generate fastlane/test_output/UnitTests.json fastlane/test_output cobertura-xml --verbose
    # Split big cobertura file
    - python3 scripts/split-by-package.py fastlane/test_output/cobertura.xml fastlane/test_output/
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: fastlane/test_output/cobertura-*.xml
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PIPELINE_ID/account-lane-1
  tags:
    - account-lane-1

#
