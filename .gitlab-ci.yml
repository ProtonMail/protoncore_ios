i18n-crowdin-sync:
  stage: i18n
  needs: []
  variables:
    I18N_SYNC_CROWDIN_PROJECT: "apple-core"
  extends: .i18n-sync-crowdin-shared-apple


i18n-commit-locales:
  stage: i18n
  needs: []
